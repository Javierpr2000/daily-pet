<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #1e1f24; color: #eee; }
  header { padding: 10px 12px; display: flex; justify-content: space-between; -webkit-app-region: drag; background: #2a2c33; }
  header button { -webkit-app-region: no-drag; }
  h3 { margin: 12px 12px 4px; font-size: 12px; text-transform: uppercase; color: #999; }
  ul { list-style: none; margin: 0; padding: 0 12px; }
  li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #333; }
  li.done span { text-decoration: line-through; color: #777; }
  li span { flex: 1; }
  button { background: #3a3d46; color: #eee; border: 0; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  input, select { background: #2a2c33; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px; }
  small { display: block; color: #999; font-size: 12px; }
  button:disabled { opacity: .4; cursor: default; }
</style></head>
<body>
<header><b>Hoy</b><button onclick="api.togglePanel()">✕</button></header>
<div style="padding: 12px"><button id="add" style="width: 100%">+ Nueva tarea</button></div>
<label style="padding: 0 12px">Recordatorio <input id="reminder" type="time"></label>
<h3>Diarias</h3><ul id="daily"></ul>
<h3>Solo hoy</h3><ul id="today"></ul>
<script>
  let data;

  async function refresh() { data = await api.getTasks(); render(); }
  async function run(op, arg) { data = await api.op(op, arg); render(); }

  function render() {
    for (const kind of ['daily', 'today']) {
      document.getElementById(kind).replaceChildren(...data.tasks.filter(t => t.kind === kind).map(t => {
        const li = document.createElement('li');
        li.className = t.done >= t.required ? 'done' : '';
        const name = document.createElement('span');
        name.textContent = t.title;
        const unit = { s: 's', m: 'min', h: 'h' }[t.unit ?? 'm'];
        const hint = [t.at && `⏰ ${t.at}`, t.every && `cada ${t.every} ${unit}`].filter(Boolean).join(' · ');
        if (hint) name.append(' ', Object.assign(document.createElement('small'), { textContent: hint }));
        name.title = 'Doble clic para editar';
        name.ondblclick = () => api.openEditor(t.id);
        const edit = document.createElement('button');
        edit.textContent = '✎';
        edit.title = 'Editar';
        edit.onclick = () => api.openEditor(t.id);
        const up = document.createElement('button');
        up.textContent = '▲';
        up.title = 'Subir';
        up.onclick = () => run('move', { id: t.id, delta: -1 });
        const down = document.createElement('button');
        down.textContent = '▼';
        down.title = 'Bajar';
        down.onclick = () => run('move', { id: t.id, delta: 1 });
        const tick = document.createElement('button');
        tick.textContent = `${t.done}/${t.required}`;
        tick.onclick = () => run('tick', t.id);
        const minus = document.createElement('button');
        minus.textContent = '−';
        minus.title = 'Restar tick';
        minus.disabled = t.done === 0;
        minus.onclick = () => run('untick', t.id);
        const del = document.createElement('button');
        del.textContent = '🗑';
        del.onclick = () => run('remove', t.id);
        li.append(name, minus, tick, up, down, edit, del);
        return li;
      }));
    }
  }

  document.getElementById('add').onclick = () => api.openEditor(null);

  const reminder = document.getElementById('reminder');
  api.getReminder().then(t => { reminder.value = t ?? ''; });
  reminder.onchange = () => api.setReminder(reminder.value || null);

  api.onChanged(refresh);
  refresh();
</script>
</body></html>
