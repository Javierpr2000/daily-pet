<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  /* assets/pet.png: 32px frames, x3. Row 0 = idle (5), row 1 = walk (8). */
  #pet { width: 96px; height: 96px; cursor: pointer; image-rendering: pixelated;
    background: url(assets/pet.png) 0 -96px / 768px 288px;
    animation: walk .8s steps(8) infinite; }
  #pet.idle { background-position-y: 0; animation: idle .8s steps(5) infinite; }
  #pet.left { transform: scaleX(-1); }
  #progress { position: absolute; top: 0; left: 0; right: 0; text-align: center; pointer-events: none;
    font: bold 13px monospace; color: #fff; text-shadow: -1px -1px #000, 1px -1px #000, -1px 1px #000, 1px 1px #000; }
  #progress:empty { display: none; }
  body.happy #progress { color: #5f5; }
  body.happy { animation: hop .4s 3; }
  @keyframes hop { 50% { translate: 0 -6px; } }
  @keyframes walk { from { background-position-x: 0; } to { background-position-x: -768px; } }
  @keyframes idle { from { background-position-x: 0; } to { background-position-x: -480px; } }
</style></head>
<body>
<div id="pet"></div>
<div id="progress"></div>
<script>
  const pet = document.getElementById('pet');
  let last, dragged = false;
  pet.onpointerdown = e => { if (e.button !== 0) return; last = [e.screenX, e.screenY]; dragged = false; pet.setPointerCapture(e.pointerId); };
  pet.onpointermove = e => {
    if (!last) return;
    const dx = Math.round(e.screenX - last[0]), dy = Math.round(e.screenY - last[1]);
    if (!dragged && Math.abs(dx) + Math.abs(dy) < 4) return;
    dragged = true;
    last = [last[0] + dx, last[1] + dy];
    api.moveBy(dx, dy);
  };
  pet.onpointerup = () => { last = null; if (dragged) api.dragEnd(); };
  pet.onclick = () => { if (!dragged) api.togglePanel(); };
  pet.oncontextmenu = e => { e.preventDefault(); api.menu(); };
  pet.onmouseenter = () => { api.hover(true); pet.classList.add('idle'); };
  pet.onmouseleave = () => { api.hover(false); pet.classList.remove('idle'); };
  api.onProgress((done, total) => {
    const happy = total > 0 && done === total;
    document.getElementById('progress').textContent = total ? (happy ? '✓ ' : '') + `${done}/${total}` : '';
    document.body.classList.toggle('happy', happy);
  });
  api.onDir(d => {
    pet.classList.toggle('idle', d === 0);
    if (d) pet.classList.toggle('left', d < 0);
  });
</script>
</body></html>
